[package]
name = "prismproxy"
version = "0.1.0"
edition = "2021"
description = "A programmable reverse proxy with WebAssembly plugin support"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
